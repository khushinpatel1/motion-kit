name: Verify

# The one pipeline: CI runs on the commit that changed something, not on a
# nightly timer. This repo is frozen in place (public, no further work),
# so in practice this now costs nothing until someone pushes.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
